# EvolveArena — iOS derlemesi (App Store / TestFlight)
#
# Secret'lar yoksa: yalnızca simülatör için imzasız derleme yapılır (projenin
# derlendiğini doğrular).
# Secret'lar varsa: imzalı arşiv oluşturulur ve doğrudan App Store Connect'e
# (TestFlight) yüklenir. Sertifika / profil dosyası GEREKMEZ: Xcode'un bulut
# imzalaması App Store Connect API anahtarıyla her şeyi kendisi halleder.
#
# GEREKEN SECRET'LAR (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID          Apple Developer ekip kimliği (10 karakter)
#   ASC_KEY_ID             App Store Connect API anahtar kimliği
#   ASC_ISSUER_ID          App Store Connect API "Issuer ID"
#   ASC_KEY_P8_BASE64      indirilen AuthKey_XXXX.p8 dosyasının base64 hali
# Anahtarın rolü "App Manager" (ya da Admin) olmalı.
# Ayrıntılar: mobile/MAGAZA_REHBERI.md
name: iOS

on:
  workflow_dispatch:
  push:
    branches: [main, master, "claude/**"]
    paths: ["mobile/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/ios.yml"]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash   # -eo pipefail: "| tail" hatayı yutmasın
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Xcode seç (en yeni kararlı)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | grep -v beta | sort -V | tail -1)"
          xcodebuild -version

      - name: Bağımlılıklar ve derleme
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Secret'lar var mı?
        id: sig
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -n "$TEAM" ] && [ -n "$KEY" ]; then echo "signed=1" >> "$GITHUB_OUTPUT"; else
            echo "signed=0" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple secret'ları tanımlı değil — yalnızca simülatör derlemesi yapılacak."
          fi

      - name: Simülatör derlemesi (imzasız)
        if: steps.sig.outputs.signed == '0'
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40

      - name: Arşivle ve App Store Connect'e yükle
        if: steps.sig.outputs.signed == '1'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          echo "$KEY_B64" | base64 -d > "$KEY_PATH"
          VERSION=$(node -p "require('./package.json').version")
          BUILD=${{ github.run_number }}
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY_PATH -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            $AUTH archive | tail -n 40
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            $AUTH | tail -n 40
          echo "Yüklendi: sürüm $VERSION ($BUILD). App Store Connect > TestFlight'ta birkaç dakika içinde görünür."
