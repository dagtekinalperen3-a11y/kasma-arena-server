# EvolveArena — Android derlemesi (Google Play)
#
# Her çalışmada şunlar "Artifacts" olarak indirilebilir:
#   - evolvearena-debug.apk     : telefona doğrudan kurup denemek için
#   - evolvearena-release.aab   : Google Play Console'a yüklenecek paket
#                                 (yükleme anahtarı secret'ları tanımlıysa imzalı)
#
# İMZA İÇİN GEREKEN SECRET'LAR (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    keystore dosyasının base64 hali
#   ANDROID_KEYSTORE_PASSWORD  keystore şifresi
#   ANDROID_KEY_ALIAS          anahtar adı (ör. upload)
#   ANDROID_KEY_PASSWORD       anahtar şifresi
# İSTEĞE BAĞLI (Play'e otomatik yükleme, ilk sürüm elle yüklendikten sonra):
#   PLAY_SERVICE_ACCOUNT_JSON  Google Play Console hizmet hesabı JSON'u
# Ayrıntılar: mobile/MAGAZA_REHBERI.md
name: Android

on:
  workflow_dispatch:
    inputs:
      play_track:
        description: "Play'e yükle (boş = yükleme). internal / alpha / beta / production"
        required: false
        default: ""
  push:
    branches: [main, master, "claude/**"]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/android.yml"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash   # -eo pipefail: "| tail" hatayı yutmasın
        working-directory: mobile
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Sürüm adı
        run: echo "APP_VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Bağımlılıklar
        run: npm ci

      - name: Oyunu derle (TypeScript + Vite)
        run: npm run build

      - name: Capacitor eşitle
        run: npx cap sync android

      - name: Yükleme anahtarını hazırla
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "İmzalı sürüm derlenecek."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 tanımlı değil — release paketi İMZASIZ olacak (Play'e yüklenemez). Debug APK yine de denenebilir."
          fi

      - name: Gradle derlemesi
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Çıktıları topla
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/evolvearena-debug.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/evolvearena-release.aab
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: evolvearena-android-${{ env.APP_VERSION_NAME }}-${{ github.run_number }}
          path: mobile/out/*
          retention-days: 30

      - name: Google Play'e yükle
        if: ${{ github.event.inputs.play_track != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.evolvearena.game
          releaseFiles: mobile/out/evolvearena-release.aab
          track: ${{ github.event.inputs.play_track }}
          status: completed
