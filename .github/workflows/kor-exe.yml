name: KÖR EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'kor/**'
      - '.github/workflows/kor-exe.yml'

jobs:
  exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: kor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run exe:win
      - uses: actions/upload-artifact@v4
        with:
          name: KOR-Korku-Oyunu
          path: kor/exe/KOR-Korku-Oyunu.exe
          retention-days: 30
